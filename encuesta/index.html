<style>
/* Una columna de lectura (720px), barra fija de avance arriba y navegación al pie de cada página. */
:root {
  --bg: #EDF1EF; --surface: #FFFFFF; --ink: #14201D; --muted: #586864; --line: #D3DCD8;
  --accent: #0B6E5F; --accent-ink: #FFFFFF; --accent-soft: #DBEDE8;
  --alert: #A8481A; --alert-soft: #F7E4D6;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", "Segoe UI", sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0E1514; --surface: #17201E; --ink: #E7EEEB; --muted: #9BACA7; --line: #2A3835;
    --accent: #56C7B2; --accent-ink: #06211C; --accent-soft: #16322D;
    --alert: #F2A772; --alert-soft: #3B2616; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

.bar { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding-inline: 16px; }
.bar-in { max-width: 720px; margin-inline: auto; padding-block: 10px; display: flex; flex-direction: column; gap: 8px; }
.bar-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-size: 13px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.where { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.track { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.fill { height: 100%; width: 0; background: var(--accent); transition: width .25s ease; }
@media (prefers-reduced-motion: reduce) { .fill { transition: none; } }

.wrap { max-width: 752px; margin-inline: auto; padding-inline: 16px; padding-block: 24px 48px; display: flex; flex-direction: column; gap: 20px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(26px, 5vw, 34px); line-height: 1.12; margin: 0; text-wrap: balance; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.2; margin: 0; text-wrap: balance; }
h3 { font-family: var(--font-display); font-weight: 500; font-size: 19px; line-height: 1.25; margin: 0; }
p { margin: 0; }
.lead { color: var(--muted); max-width: 65ch; }
.head { display: flex; flex-direction: column; gap: 8px; }
.intro { display: flex; flex-direction: column; gap: 10px; max-width: 65ch; }
.note { font-size: 14px; color: var(--muted); border-left: 3px solid var(--accent); padding-left: 10px; max-width: 65ch; }
.note.warn { border-left-color: var(--alert); }

.q { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.q.bad { border-color: var(--alert); }
.q-title { font-weight: 600; }
.req { color: var(--alert); font-weight: 700; }
.q-help { font-size: 14px; color: var(--muted); }
.err { font-size: 14px; color: var(--alert); font-weight: 600; }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opt { display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; min-width: 0; }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.opt:has(input:disabled) { opacity: .45; cursor: not-allowed; }
.opt input { margin-top: 4px; accent-color: var(--accent); flex: none; }
.opt span { min-width: 0; overflow-wrap: anywhere; }
.field { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; }
textarea.field { min-height: 96px; resize: vertical; }
.other { margin-left: 34px; width: calc(100% - 34px); }
.count { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.skill { display: flex; flex-direction: column; gap: 10px; }
.skill-head { display: flex; flex-direction: column; gap: 2px; padding-top: 8px; }
.skill-def { color: var(--muted); max-width: 65ch; }

.nav { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 18px; font-weight: 600; cursor: pointer; }
.btn.main { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .6; cursor: progress; }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

/* ── Resumen final ── */
.sum { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 16px; }
.sum-sec { display: flex; flex-direction: column; gap: 6px; }
.sum-label { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.sum-list { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.sum-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: baseline; }
.sum-row span:last-child { color: var(--muted); font-size: 14px; text-align: right; font-variant-numeric: tabular-nums; }
.sum-date { font-size: 14px; color: var(--muted); }
.rep { display: flex; flex-direction: column; gap: 12px; }
.pri { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.pri-tit { font-size: 21px; }
.pri-cat { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.pri-def { color: var(--ink); max-width: 65ch; }
.mets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 6px; }
.met { background: var(--bg); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.met-v { font-family: var(--font-display); font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.met-l { font-size: 12px; color: var(--muted); }
.chart { width: 100%; overflow-x: auto; }
.chart svg { display: block; font-family: var(--font-body); }
.sem { display: flex; flex-direction: column; gap: 4px; padding-top: 10px; border-top: 1px solid var(--line); }
.sem-h { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.sem-c { font-size: 13px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.sem-f { font-weight: 600; }
@media (max-width: 340px) { .mets { grid-template-columns: 1fr; } }
.acts { display: flex; flex-wrap: wrap; gap: 8px; }
.acts .btn { flex: 1 1 160px; }
.mail { display: flex; gap: 8px; flex-wrap: wrap; }
.mail .field { flex: 1 1 200px; }
.ok { font-size: 14px; color: var(--accent); font-weight: 600; min-height: 1.4em; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 14px; align-self: flex-start; }
@media print {
  .bar, .acts, .mail, .linkbtn, .ok, .no-print { display: none !important; }
  body { background: #fff; color: #000; }
  .sum { border-color: #999; }
}
</style>
</head>

      var nom = CORTO[h.clave] || h.nombre;
      n('text', { x: L - 10, y: cy, dy: '0.35em', 'text-anchor': 'end', 'font-size': 13, 'font-weight': pri ? 700 : 400, fill: 'var(--ink)' }, nom);
      var gp = g && g.listo && g.p[h.clave] ? Number(g.p[h.clave].criticidad) : null;
      if (gp !== null) {
        n('line', { x1: x(Math.min(gp, h.crit || 1)), x2: x(Math.max(gp, h.crit || 1)), y1: cy, y2: cy, stroke: 'var(--muted)', 'stroke-width': 2 });
        n('circle', { cx: x(gp), cy: cy, r: 6, fill: 'var(--surface)', stroke: 'var(--alert)', 'stroke-width': 2.5 });
      }
      n('circle', { cx: x(h.crit || 1), cy: cy, r: 6.5, fill: 'var(--accent)' });
    });
    box.appendChild(svg);
  }

  function renderResumen() {
    var r = state.resumen;
    if (!r || !r.habs) {
      var h0 = el('div', 'head'); h0.appendChild(el('h1', null, 'Gracias por su tiempo'));
      h0.appendChild(el('p', 'lead', 'Sus respuestas quedaron registradas de forma anónima. Ya puede cerrar esta página.')); app.appendChild(h0);
      return;
    }
    if (!state.grupo) cargarGrupo();
    var g = grupoDe(r);

    var head = el('div', 'head');
    head.appendChild(el('h1', null, 'Su perfil de prioridades'));
    head.appendChild(el('p', 'lead', 'Gracias. Sus respuestas quedaron registradas de forma anónima. Este reporte muestra las tres habilidades que, según sus respuestas, conviene atender primero en su equipo.'));
    head.appendChild(el('p', 'sum-date', perfil(r) + ' · ' + r.fecha));
    app.appendChild(head);

    // 1. Tres prioridades
    var s1 = el('section', 'rep'); s1.appendChild(el('h2', null, 'Sus tres prioridades'));
    r.prioridades.forEach(function (k, i) {
      var h = hab(r, k), d = difTxt(dif(h, g));
      var c = el('article', 'pri');
      var t = el('h3', 'pri-tit', (i + 1) + '. ' + h.nombre); c.appendChild(t);
      c.appendChild(el('div', 'pri-cat', h.cat));
      c.appendChild(el('p', 'pri-def', h.def));
      var mets = el('div', 'mets');
      function met(valor, etq) { var m = el('div', 'met'); m.appendChild(el('span', 'met-v', valor)); m.appendChild(el('span', 'met-l', etq)); mets.appendChild(m); }
      met(h.crit + ' / 25', 'Criticidad');
      met(h.n ? h.n + ' / 5' : '—', h.n ? 'Nivel actual' : 'Nivel no observado');
      met(d || '—', d ? 'Diferencia con el grupo' : 'Grupo pendiente');
      c.appendChild(mets);
      s1.appendChild(c);
    });
    s1.appendChild(el('p', 'q-help', 'Criticidad: frecuencia por consecuencia, de 1 a 25. Diferencia con el grupo: su criticidad menos el promedio; si es positiva, usted la considera más crítica que el resto.'));
    app.appendChild(s1);

    // 2. Comparación
    var s2 = el('section', 'rep sum'); s2.appendChild(el('h2', null, 'Comparación con el promedio grupal'));
    if (g && g.listo) {
      s2.appendChild(el('p', 'q-help', 'Criticidad de cada habilidad, de 1 a 25. El punto verde es su respuesta; el círculo naranja, el promedio de ' + g.nombre + ' (' + g.n + ' respuestas). En negritas, sus tres prioridades.'));
      var box = el('div', 'chart'); s2.appendChild(box); app.appendChild(s2); grafica(box, r, g);
    } else {
      s2.appendChild(el('p', null, 'El promedio grupal aparece cuando haya al menos ' + (g ? g.minimo : 20) + ' respuestas, para proteger el anonimato de quienes participan.' + (g ? ' Faltan ' + Math.max(0, g.faltan) + '.' : '')));
      s2.appendChild(el('p', 'q-help', 'Mientras tanto, esta es su criticidad por habilidad.'));
      var box2 = el('div', 'chart'); s2.appendChild(box2); app.appendChild(s2); grafica(box2, r, null);
      s2.appendChild(el('p', 'q-help no-print', 'Si vuelve a abrir este enlace desde este dispositivo más adelante, la comparación se actualizará sola.'));
    }

    // 3. Plan
    var s3 = el('section', 'rep sum'); s3.appendChild(el('h2', null, 'Plan de seguimiento de 8 semanas'));
    s3.appendChild(el('p', 'q-help', 'Una propuesta para la educación continua de su equipo, construida con sus tres prioridades.'));
    planDe(r).forEach(function (s) {
      var b = el('div', 'sem');
      var hd = el('div', 'sem-h'); hd.appendChild(el('span', 'sem-c', s.cuando)); hd.appendChild(el('span', 'sem-f', s.foco)); b.appendChild(hd);
      var ul = el('ul', 'sum-list'); s.pasos.forEach(function (p) { ul.appendChild(el('li', null, p)); }); b.appendChild(ul);
      s3.appendChild(b);
    });
    s3.appendChild(el('p', 'note', 'Este plan es una propuesta derivada de sus respuestas y del marco del estudio; no es un resultado validado.'));
    app.appendChild(s3);

    // Acciones
    var ok = el('p', 'ok'); ok.setAttribute('aria-live', 'polite');
    var acts = el('div', 'acts');
    var bp = el('button', 'btn main', 'Descargar reporte en PDF'); bp.type = 'button'; bp.id = 'btnPdf';
    bp.addEventListener('click', function () {
      try { descargarPdf(r); ok.textContent = 'PDF descargado.'; }
      catch (e) { ok.textContent = 'No se pudo crear el PDF; se abrirá la opción de imprimir.'; window.print(); }
    });
    acts.appendChild(bp);
    var texto = textoResumen(r);
    if (navigator.share) {
      var bs = el('button', 'btn', 'Compartir'); bs.type = 'button';
      bs.addEventListener('click', function () { navigator.share({ title: 'Mi perfil de prioridades', text: texto }).catch(function () {}); });
      acts.appendChild(bs);
    }
    var bc = el('button', 'btn', 'Copiar texto'); bc.type = 'button';
    bc.addEventListener('click', function () {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(texto).then(function () { ok.textContent = 'Texto copiado.'; }, function () { ok.textContent = 'No se pudo copiar; descargue el PDF.'; });
      } else { ok.textContent = 'No se pudo copiar; descargue el PDF.'; }
    });
    acts.appendChild(bc);
    app.appendChild(acts);

    var mailSec = el('div', 'sum-sec no-print');
    mailSec.appendChild(el('div', 'sum-label', 'Enviarlo a su correo'));
    mailSec.appendChild(el('p', 'q-help', 'Se abre su aplicación de correo con el reporte en texto; solo presione enviar. Para la versión con gráfica, adjunte el PDF. Esta dirección no se guarda.'));
    var mail = el('div', 'mail');
    var mi = document.createElement('input'); mi.type = 'email'; mi.className = 'field'; mi.id = 'correoResumen'; mi.placeholder = 'su@correo.com';
    mi.autocomplete = 'email'; mi.setAttribute('aria-label', 'Correo para enviar el reporte'); mi.value = state.correo || '';
    var bm = el('button', 'btn', 'Abrir correo'); bm.type = 'button';
    bm.addEventListener('click', function () {
      var to = mi.value.trim();
      if (to && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(to)) { ok.textContent = 'Revise la dirección de correo.'; return; }
      location.href = 'mailto:' + encodeURIComponent(to) + '?subject=' + encodeURIComponent('Mi perfil de prioridades: habilidades blandas') + '&body=' + encodeURIComponent(texto);
      ok.textContent = 'Si no se abrió su correo, use "Copiar texto".';
    });
    mail.appendChild(mi); mail.appendChild(bm); mailSec.appendChild(mail);
    app.appendChild(mailSec);
    app.appendChild(ok);

    app.appendChild(el('p', 'note no-print', 'El reporte queda guardado solo en este navegador. Si vuelve a abrir el enlace desde este mismo dispositivo, lo encontrará aquí.'));
    var borrar = el('button', 'linkbtn', 'Borrar el reporte de este dispositivo'); borrar.type = 'button';
    borrar.addEventListener('click', function () { state.resumen = null; state.correo = ''; state.grupo = null; save(); render(); });
    app.appendChild(borrar);
  }

  render();
})();
</script>
</body>
</html>
